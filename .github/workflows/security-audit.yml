name: Linux Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-audit:
    name: Run Linux Hardening Audit on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Run audit on EC2
        run: |
          set -o pipefail
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'cd ~/linux-hardening && git pull && chmod +x hardening-audit.sh && ./hardening-audit.sh' \
            | tee audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: linux-hardening-audit
          path: audit-report.txt
